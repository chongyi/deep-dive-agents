[book]
title = "深入浅出 Agent"
authors = ["wenshi-agent-project"]
description = "从零理解 Agent 的构造，以主流开源实现印证设计取舍，并延伸到递归自我改进（RSI）的边界"
src = "src"
language = "zh-CN"

[build]
build-dir = "book"
create-missing = true
use-default-preprocessors = true

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
# 托管在 GitHub Pages 子路径下（https://chongyi.github.io/deep-dive-agents/），
# site-url 必须与之一致，否则搜索与静态资源路径会错
site-url = "/deep-dive-agents/"
git-repository-url = "https://github.com/chongyi/deep-dive-agents"
# mdBook 0.5 特性：GFM 提示框（> [!NOTE] / [!WARNING] 等）与定义列表
admonitions = true
definition-lists = true
smart-punctuation = false
no-section-label = false
# mermaid 渲染方案：不使用 mdbook-mermaid 预处理器，
# 直接内置 mermaid.min.js（12.1.0）+ 自写加载脚本，在浏览器端渲染 ```mermaid 代码块
# 告示框方案：mdBook 0.5 不支持「[!NOTE] 标题」写法（上游 #2975/#3031 未实现），
# admonition-loader.js 在浏览器端将其改写为原生同构结构（复用内置类名/图标/样式）
additional-css = ["custom.css"]
additional-js = ["mermaid.min.js", "mermaid-loader.js", "admonition-loader.js"]

[output.html.fold]
enable = true
level = 0

[output.html.search]
enable = true
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
limit-results = 30

[output.html.print]
enable = true
